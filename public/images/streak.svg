<svg viewBox="0 0 500 130" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block;">
  <defs>
    <linearGradient id="str-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2128" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="str-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0883e" />
      <stop offset="70%" stop-color="#f85149" />
      <stop offset="100%" stop-color="#f85149" stop-opacity="0" />
    </linearGradient>
    <filter id="str-glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="500" height="130" rx="12" fill="url(#str-bg)" stroke="#30363d" stroke-width="1" />
  <rect width="275" height="2" rx="1" fill="url(#str-accent)" filter="url(#str-glow)" />
  <text x="20" y="34" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f0883e" font-weight="600">Contribution Streak</text>
  <line x1="16" y1="46" x2="484" y2="46" stroke="#21262d" stroke-width="1" />
  
    <g>
      <text x="90" y="86" font-family="'JetBrains Mono', monospace" font-size="26" fill="#e6edf3" font-weight="700" text-anchor="middle">387</text>
      <text x="90" y="106" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#8b949e" text-anchor="middle" letter-spacing="1.2">TOTAL CONTRIBUTIONS</text>
    </g>
    <g>
      <text x="270" y="86" font-family="'JetBrains Mono', monospace" font-size="26" fill="#e6edf3" font-weight="700" text-anchor="middle">12d</text>
      <text x="270" y="106" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#8b949e" text-anchor="middle" letter-spacing="1.2">CURRENT STREAK</text>
    </g>
    <g>
      <text x="430" y="86" font-family="'JetBrains Mono', monospace" font-size="26" fill="#e6edf3" font-weight="700" text-anchor="middle">21d</text>
      <text x="430" y="106" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#8b949e" text-anchor="middle" letter-spacing="1.2">LONGEST STREAK</text>
    </g>
  <line x1="166.66666666666666" y1="56" x2="166.66666666666666" y2="115" stroke="#21262d" stroke-width="1" />
  <line x1="333.3333333333333" y1="56" x2="333.3333333333333" y2="115" stroke="#21262d" stroke-width="1" />
</svg>